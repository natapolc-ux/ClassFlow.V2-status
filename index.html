<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Flow V.2 — เช็กสถานะ</title>
<style>
:root{font-family:Tahoma,sans-serif;color:#18212b;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 20px 20px}.filters,.card{background:#fff;border:1px solid #d9cfbd;border-radius:16px;padding:18px;box-shadow:0 5px 18px #0000000c}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}label{font-weight:bold;font-size:14px}select,input,button{width:100%;padding:11px;border:1px solid #bdb4a5;border-radius:10px;margin-top:6px}button{background:#d86b4a;color:#fff;border:0;font-weight:bold;cursor:pointer}.message{min-height:30px;padding:10px 2px;color:#765}.card{margin-top:14px}.card h2{margin:0}.room{color:#6b7280;margin:5px 0 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th:last-child,td:last-child{text-align:center;width:150px}.status{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:bold}.checked{background:#d1fae5;color:#166534}.sent{background:#dbeafe;color:#1d4ed8}.missing{background:#fee2e2;color:#991b1b}@media(max-width:720px){.filters{grid-template-columns:1fr}.wrap{padding:16px 12px}}
</style></head><body>
<main class="wrap"><section class="filters">
<label>ระดับชั้น<select id="level" onchange="levelChanged()"></select></label>
<label>ห้อง<select id="className"><option value="">เลือกห้อง</option></select></label>
<label>รหัสนักเรียน (ไม่บังคับ)<input id="studentId" placeholder="เว้นว่างเพื่อดูทั้งห้อง"></label>
<button onclick="searchStatus()">ตรวจสอบ</button>
</section><div id="message" class="message"></div><div id="results"></div></main>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
