<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class Flow V.2 — เช็กสถานะ</title>
<style>
:root{font-family:Tahoma,sans-serif;color:#18212b;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:32px 20px 20px}.filters,.table-wrap{background:#fff;border:1px solid #d9cfbd;border-radius:16px;box-shadow:0 5px 18px #0000000c}.filters{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:10px;align-items:end;padding:18px}label{font-weight:bold;font-size:14px}select,input,button{width:100%;padding:11px;border:1px solid #bdb4a5;border-radius:10px;margin-top:6px}button{background:#d86b4a;color:#fff;border:0;font-weight:bold;cursor:pointer}.message{min-height:42px;padding:12px 2px;color:#765}.table-wrap{overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}th,td{padding:10px;border-right:1px solid #eee;border-bottom:1px solid #eee;text-align:center;white-space:nowrap;background:#fff}thead th{position:sticky;top:0;z-index:3;background:#f4eadc}.assignment{min-width:150px;max-width:240px;white-space:normal}.sticky{position:sticky;z-index:2}.no{left:0;min-width:64px}.name{left:64px;min-width:220px;text-align:left;border-right:2px solid #d9cfbd}.name small{display:block;color:#7b8490;margin-top:3px;font-weight:normal}.status{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:bold}.checked{background:#d1fae5;color:#166534}.sent{background:#dbeafe;color:#1d4ed8}.missing{background:#fee2e2;color:#991b1b}@media(max-width:720px){.filters{grid-template-columns:1fr}.wrap{padding:16px 12px}.name{min-width:170px}}
</style></head><body>
<main class="wrap"><section class="filters">
<label>ระดับชั้น<select id="level" onchange="levelChanged()"></select></label>
<label>ห้อง<select id="className"><option value="">เลือกห้อง</option></select></label>
<label>ค้นหาชื่อนักเรียนหรือรหัสนักเรียน (ไม่บังคับ)<input id="studentSearch" placeholder="เว้นว่างเพื่อดูทั้งห้อง" onkeydown="if(event.key==='Enter')searchStatus()"></label>
<button onclick="searchStatus()">ตรวจสอบ</button>
</section><div id="message" class="message"></div><div id="results"></div></main>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
